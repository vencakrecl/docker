# Setup: examples/README.md. Build fpm-nginx-alpine before this derived image.
# Complete the WordPress browser wizard with host=db and name/user/password=wordpress.
name: example-wordpress

services:
  fpm-nginx:
    build:
      context: .
      # Override the base tag if you built a different PHP version, e.g.:
      # args: { BASE_IMAGE: fpm-nginx:8.5-alpine }
    # PHP is tuned via the image's env knobs (common/php.ini), not a mounted php.ini.
    environment:
      SERVER_ROOT: /app
      PHP_MEMORY_LIMIT: 256M
      PHP_UPLOAD_MAX_FILESIZE: 64M
      PHP_POST_MAX_SIZE: 128M
      PHP_MAX_INPUT_VARS: 3000
      SERVER_TIMEOUT: 300          # web-server backend request timeout (seconds)
    volumes:
      - ./app:/app
    depends_on:
      - db
    ports: ["8081:8080"]
    restart: unless-stopped

  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  db-data:
