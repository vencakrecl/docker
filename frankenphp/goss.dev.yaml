# Dev toolbox smoke tests; run via make test-dev-frankenphp.
command:
  enabled-extensions:
    exec: php -m
    exit-status: 0
    stdout:
      - "/^apcu$/"
      - "/^bcmath$/"
      - "/^ctype$/"
      - "/^curl$/"
      - "/^dom$/"
      - "/^exif$/"
      - "/^fileinfo$/"
      - "/^filter$/"
      - "/^gd$/"
      - "/^hash$/"
      - "/^iconv$/"
      - "/^igbinary$/"
      - "/^imagick$/"
      - "/^intl$/"
      - "/^json$/"
      - "/^libxml$/"
      - "/^mbstring$/"
      - "/^mysqli$/"
      - "/^openssl$/"
      - "/^pcntl$/"
      - "/^pcov$/"
      - "/^pcre$/"
      - "/^PDO$/"
      - "/^pdo_mysql$/"
      - "/^pdo_pgsql$/"
      - "/^pdo_sqlite$/"
      - "/^redis$/"
      - "/^session$/"
      - "/^SimpleXML$/"
      - "/^SPX$/"
      - "/^tokenizer$/"
      - "/^xdebug$/"
      - "/^xml$/"
      - "/^xmlreader$/"
      - "/^xmlwriter$/"
      - "/^zip$/"
  composer:
    exec: composer --version --no-interaction
    exit-status: 0
    stdout: ["Composer"]
  castor:
    exec: castor --version
    exit-status: 0
  # xdebug ships OFF by default (zero overhead) ...
  xdebug-off-by-default:
    exec: php -r 'echo ini_get("xdebug.mode");'
    exit-status: 0
    stdout: ["off"]
  # ... and is opt-in via XDEBUG_MODE (set inline; php re-parses config each run).
  env-xdebug-mode:
    exec: env XDEBUG_MODE=debug php -r 'echo ini_get("xdebug.mode");'
    exit-status: 0
    stdout: ["debug"]
