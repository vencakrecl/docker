# Run with GOSS_FILE=goss.aws.yaml dgoss run --privileged <image>.
# Goss templates comments too; avoid Go-template brace syntax.
process:
  dockerd:
    running: true
command:
  runs-as-non-root:
    exec: id -u
    exit-status: 0
    stdout:
      - "!/^0$/"
  docker-server:
    exec: sh -c 'DOCKER_HOST=unix:///run/user/1000/docker.sock docker version'
    exit-status: 0
    stdout:
      - Server
  aws-cli:
    exec: aws --version
    exit-status: 0
    stdout:
      - aws-cli
