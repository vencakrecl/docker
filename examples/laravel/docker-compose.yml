# Setup and ports: examples/README.md; make -C examples laravel.
name: example-laravel

x-app: &app
  environment:
    SERVER_ROOT: /app/public
    # Probe Laravel boot through /up instead of the runtime-only /healthz.
    HEALTHCHECK_PATH: /up
    PHP_MEMORY_LIMIT: 256M
    PHP_OPCACHE_INTERNED_STRINGS_BUFFER: 16
  volumes:
    - ./app:/app
  restart: unless-stopped

services:
  fpm-nginx:
    <<: *app
    build: { context: ../.., dockerfile: fpm-nginx/Dockerfile }
    ports: ["8081:8080"]
  fpm-apache:
    <<: *app
    build: { context: ../.., dockerfile: fpm-apache/Dockerfile }
    ports: ["8082:8080"]
  frankenphp:
    <<: *app
    build: { context: ../.., dockerfile: frankenphp/Dockerfile }
    ports: ["8083:8080"]
