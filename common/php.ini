; Shared PHP defaults with environment overrides. See docs/configuration.md.

memory_limit = ${PHP_MEMORY_LIMIT:-128M}
upload_max_filesize = ${PHP_UPLOAD_MAX_FILESIZE:-2M}
post_max_size = ${PHP_POST_MAX_SIZE:-8M}
max_input_vars = ${PHP_MAX_INPUT_VARS:-1000}
date.timezone = ${PHP_DATE_TIMEZONE:-UTC}

log_errors = ${PHP_LOG_ERRORS:-On}
error_log = ${PHP_ERROR_LOG:-/proc/self/fd/2}
display_errors = ${PHP_DISPLAY_ERRORS:-Off}
display_startup_errors = ${PHP_DISPLAY_STARTUP_ERRORS:-Off}
error_reporting = ${PHP_ERROR_REPORTING:-E_ALL}

; Share the backend timeout; the CLI SAPI forces max_execution_time to 0.
max_execution_time = ${SERVER_TIMEOUT}

; Reset OPcache on deploy when validate_timestamps is disabled.
opcache.memory_consumption = ${PHP_OPCACHE_MEMORY_CONSUMPTION:-128}
opcache.max_accelerated_files = ${PHP_OPCACHE_MAX_ACCELERATED_FILES:-10000}
opcache.interned_strings_buffer = ${PHP_OPCACHE_INTERNED_STRINGS_BUFFER:-8}
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS:-1}
; CLI OPcache is useful for long-running workers.
opcache.enable_cli = ${PHP_OPCACHE_ENABLE_CLI:-0}
; Preloading snapshots code at startup; restart after code changes.
; preload_user must match SERVER_USER.
opcache.preload = ${PHP_OPCACHE_PRELOAD:-}
opcache.preload_user = ${PHP_OPCACHE_PRELOAD_USER:-www-data}
realpath_cache_size = ${PHP_REALPATH_CACHE_SIZE:-4096K}
realpath_cache_ttl = ${PHP_REALPATH_CACHE_TTL:-120}
