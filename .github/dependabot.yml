# Dependabot cannot resolve FROM ${BASE_IMAGE}; tool pins are managed by Renovate/common/deps.sh.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
    commit-message:
      prefix: chore

  # Regenerate the Azure lockfile with dind/gen-azure-hashes.sh.
  # Keep paramiko below 4 while azure-cli requires it; version updates are disabled.
  - package-ecosystem: pip
    directory: /dind
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: paramiko
        versions:
          - ">=4.0.0"
    labels:
      - dependencies
    commit-message:
      prefix: chore
