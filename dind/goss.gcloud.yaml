# Run with GOSS_FILE=goss.gcloud.yaml dgoss run --privileged <image>.
# Goss templates comments too; avoid Go-template brace syntax.
process:
  dockerd:
    running: true
command:
  runs-as-non-root:
    exec: id -u
    exit-status: 0
    stdout:
      - "!/^0$/"
  docker-server:
    exec: sh -c 'DOCKER_HOST=unix:///run/user/1000/docker.sock docker version'
    exit-status: 0
    stdout:
      - Server
  gcloud:
    exec: gcloud --version
    exit-status: 0
    stdout:
      - Google Cloud SDK
