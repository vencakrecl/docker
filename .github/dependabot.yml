# Dependabot cannot resolve FROM ${BASE_IMAGE}; tool pins are managed by Renovate/common/deps.sh.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
    commit-message:
      prefix: chore

  # Regenerate the Azure lockfile with dind/gen-azure-hashes.sh.
  # Allow security updates only; routine version updates use the generator.
  - package-ecosystem: pip
    directory: /dind
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels:
      - dependencies
    commit-message:
      prefix: chore
