worker_processes  auto;
# This rendered config replaces the distro config, so load Brotli modules here.
load_module /usr/lib/nginx/modules/ngx_http_brotli_filter_module.so;
load_module /usr/lib/nginx/modules/ngx_http_brotli_static_module.so;
error_log  /dev/stderr  ${NGINX_ERROR_LOG_LEVEL};
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    sendfile      on;

    gzip              on;
    gzip_static       on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml text/javascript
                      application/json application/javascript application/xml
                      application/rss+xml image/svg+xml;
    brotli            on;
    brotli_static     on;
    brotli_comp_level 5;
    brotli_min_length 256;
    brotli_types      text/plain text/css text/xml text/javascript
                      application/json application/javascript application/xml
                      application/rss+xml image/svg+xml;

    server {
        listen       8080;
        server_name  _;
        root         ${SERVER_ROOT};
        index        index.php index.html;

        # Exact match keeps the FPM ping probe out of front-controller routing.
        location = /healthz {
            include       /etc/nginx/fastcgi_params;
            fastcgi_pass  127.0.0.1:9000;
            fastcgi_param SCRIPT_NAME     /healthz;
            fastcgi_param SCRIPT_FILENAME /healthz;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            # Reject missing scripts to prevent path-info requests from reaching the wrong file.
            try_files $uri =404;
            include       /etc/nginx/fastcgi_params;
            fastcgi_pass  127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout ${FASTCGI_READ_TIMEOUT}s;
        }
    }
}
