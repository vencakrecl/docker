# Alpine-only drop-in; Debian does not load conf.d.
# Stock Listen/CustomLog entries accumulate and are disabled in the Dockerfile.
Listen 8080
User ${SERVER_USER}
Group ${SERVER_USER}
LoadModule rewrite_module modules/mod_rewrite.so
# Brotli may already be loaded by the package drop-in.
<IfModule !mod_deflate.c>
LoadModule deflate_module modules/mod_deflate.so
</IfModule>
<IfModule !mod_brotli.c>
LoadModule brotli_module modules/mod_brotli.so
</IfModule>
IncludeOptional /etc/apache2/fpm-vhost.conf
