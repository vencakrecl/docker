# Setup and ports: examples/README.md; make -C examples nette.
name: example-nette

x-app: &app
  environment:
    SERVER_ROOT: /app/www
    PHP_OPCACHE_INTERNED_STRINGS_BUFFER: 16
  volumes:
    - ./app:/app
  restart: unless-stopped

services:
  fpm-nginx:
    <<: *app
    build: { context: ../.., dockerfile: fpm-nginx/Dockerfile }
    ports: ["8081:8080"]
  fpm-apache:
    <<: *app
    build: { context: ../.., dockerfile: fpm-apache/Dockerfile }
    ports: ["8082:8080"]
  frankenphp:
    <<: *app
    build: { context: ../.., dockerfile: frankenphp/Dockerfile }
    ports: ["8083:8080"]
